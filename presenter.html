<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Presenter View</title>
  <style>
    :root { --bg: #141414; --ink: #EDEBE6; --ink-3: #8F8B83; --line: #2C2B29; }
    * { box-sizing: border-box; margin: 0; }
    body { background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; padding: 28px 36px; }
    header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--line); padding-bottom: 16px; }
    .now { font-size: 26px; font-weight: 650; }
    .meta { font-size: 15px; color: var(--ink-3); letter-spacing: .08em; text-transform: uppercase; }
    .clock { font-family: ui-monospace, Menlo, monospace; font-size: 34px; font-variant-numeric: tabular-nums; }
    .notes { margin-top: 22px; font-size: 22px; line-height: 1.6; max-width: 900px; }
    .notes p + p { margin-top: 14px; }
    footer { margin-top: 28px; display: flex; gap: 12px; align-items: center; color: var(--ink-3); font-size: 15px; }
    button { font: inherit; color: var(--ink); background: #222; border: 1px solid var(--line); border-radius: 8px; padding: 8px 16px; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="meta" id="meta">Waiting for the presentation window…</div>
      <div class="now" id="now"></div>
    </div>
    <div style="text-align:right">
      <div class="clock" id="clock">0:00</div>
      <div class="meta">Elapsed · target 6:00 (5–7 min)</div>
    </div>
  </header>
  <div class="notes" id="notes"></div>
  <footer>
    <button id="prev">‹ Prev</button><button id="next">Next ›</button>
    <button id="reset">Reset timer</button>
    <span id="up"></span>
  </footer>
  <script src="notes.js"></script>
  <script>
    const N = window.SPEAKER_NOTES, main = window.opener;
    let t0 = null;
    function show(i, total) {
      const n = N[i];
      if (t0 === null) t0 = Date.now();
      document.getElementById('meta').textContent = `Slide ${i + 1} of ${total} · ≈ ${n.time}`;
      document.getElementById('now').textContent = n.title;
      document.getElementById('notes').innerHTML = n.text.map(p => `<p>${p}</p>`).join('');
      document.getElementById('up').textContent = N[i + 1] ? `Up next: ${N[i + 1].title}` : 'Last slide';
    }
    window.addEventListener('message', e => { if (e.data && e.data.type === 'slide') show(e.data.index, e.data.total); });
    const send = type => main && main.postMessage({ type }, '*');
    document.getElementById('next').onclick = () => send('next');
    document.getElementById('prev').onclick = () => send('prev');
    document.getElementById('reset').onclick = () => { t0 = Date.now(); };
    document.addEventListener('keydown', e => {
      if (['ArrowRight', ' ', 'PageDown'].includes(e.key)) { e.preventDefault(); send('next'); }
      if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); send('prev'); }
    });
    setInterval(() => {
      if (t0 === null) return;
      const s = Math.floor((Date.now() - t0) / 1000);
      document.getElementById('clock').textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    }, 500);
    send('ready');
  </script>
</body>
</html>
